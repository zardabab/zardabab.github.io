<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6688685827864026"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-6688685827864026">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏散步百科 - 新手教學指南</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* 避免 Babel 載入前的閃爍 */
        #root:empty { display: none; }
    </style>
</head>
<body class="bg-[#F5F9F1]">
    <div id="root"></div>

    <!-- 加入 data-presets="react" 並使用更嚴謹的封裝來避免 Infinity 宣告錯誤 -->
    <script type="text/babel" data-presets="react">
        (function() {
            var useState = React.useState;
            
            // 取得圖示庫，增加安全檢查
            var icons = window.lucideReact || {};
            var Leaf = icons.Leaf, 
                MapPin = icons.MapPin, 
                Search = icons.Search, 
                Trophy = icons.Trophy, 
                Wind = icons.Wind, 
                Camera = icons.Camera, 
                Heart = icons.Heart, 
                Calendar = icons.Calendar, 
                Info = icons.Info, 
                Gift = icons.Gift, 
                Star = icons.Star, 
                Zap = icons.Zap, 
                ExternalLink = icons.ExternalLink, 
                Megaphone = icons.Megaphone, 
                ChevronRight = icons.ChevronRight;

            var INVITE_CODE = "BZQZNIYYN";
            var GAME_URL = "https://pikminbloom.com/zh/";
            var AD_URL = "#";

            var App = function() {
                var state = useState('getting-started');
                var activeTab = state[0];
                var setActiveTab = state[1];
                
                var nameState = useState('皮克敏隊長');
                var nameInput = nameState[0];
                var setNameInput = nameState[1];
                
                var colorState = useState('red');
                var colorCode = colorState[0];
                var setColorCode = colorState[1];
                
                var copyState = useState(false);
                var copyFeedback = copyState[0];
                var setCopyFeedback = copyState[1];

                var handleInviteAction = function() {
                    var textArea = document.createElement("textarea");
                    textArea.value = INVITE_CODE;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        setCopyFeedback(true);
                        setTimeout(function() { setCopyFeedback(false); }, 3000);
                    } catch (err) {
                        console.error('無法複製邀請碼', err);
                    }
                    document.body.removeChild(textArea);
                    setTimeout(function() {
                        window.open(GAME_URL, '_blank');
                    }, 400);
                };

                var AdBanner = function(props) {
                    return (
                        <div className="w-full bg-white border border-dashed border-gray-300 rounded-2xl p-4 my-6 relative overflow-hidden group cursor-pointer hover:border-[#5FB85E] transition-colors" onClick={function() { window.open(AD_URL, '_blank'); }}>
                            <div className="absolute top-0 left-0 bg-gray-200 text-[10px] px-2 py-0.5 text-gray-500 rounded-br-lg uppercase font-bold">{props.label || "贊助商廣告"}</div>
                            <div className="flex items-center justify-between gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center text-gray-400 group-hover:bg-green-50 group-hover:text-[#5FB85E] transition-colors">
                                        {Megaphone && <Megaphone size={24} />}
                                    </div>
                                    <div>
                                        <p className="font-bold text-gray-800 text-sm">這裡可以置入您的品牌廣告</p>
                                        <p className="text-xs text-gray-500">吸引更多皮克敏玩家關注您的產品或服務</p>
                                    </div>
                                </div>
                                {ChevronRight && <ChevronRight size={18} className="text-gray-300 group-hover:text-[#5FB85E]" />}
                            </div>
                        </div>
                    );
                };

                var NativeAdCard = function() {
                    return (
                        <div className="bg-gradient-to-br from-yellow-50 to-orange-50 rounded-3xl p-6 shadow-sm border border-yellow-100 relative overflow-hidden cursor-pointer" onClick={function() { window.open(AD_URL, '_blank'); }}>
                            <div className="absolute top-2 right-2 text-[10px] text-yellow-600/50 font-bold">SPONSORED</div>
                            <h3 className="font-bold text-orange-800 mb-2 flex items-center gap-2 italic">
                                {Star && <Star size={16} fill="#F97316" color="#F97316" />} 搬運工特別推薦
                            </h3>
                            <p className="text-sm text-orange-700 leading-tight">想要在散步時更輕鬆嗎？試試我們的聯名舒適足弓墊，讓您走上一萬步也不累！</p>
                            <div className="mt-4 flex justify-end">
                                <span className="text-xs font-bold text-white bg-orange-500 px-3 py-1 rounded-full shadow-sm">立即查看</span>
                            </div>
                        </div>
                    );
                };

                var navItems = [
                    { id: 'getting-started', label: '新手入門', icon: Leaf && <Leaf size={18} /> },
                    { id: 'pikmin-types', label: '皮克敏百科', icon: Heart && <Heart size={18} /> },
                    { id: 'planting', label: '散步與種花', icon: Wind && <Wind size={18} /> },
                    { id: 'challenges', label: '蘑菇與挑戰', icon: Trophy && <Trophy size={18} /> },
                    { id: 'life-log', label: '生活記錄', icon: Camera && <Camera size={18} /> },
                    { id: 'tips', label: '專業小技巧', icon: Zap && <Zap size={18} /> },
                ];

                var PikminCard = function(props) {
                    return (
                        <div className="bg-white rounded-2xl p-4 shadow-sm border-b-4 transition-all hover:scale-105" style={{ borderColor: props.color }}>
                            <div className="flex items-center gap-3 mb-2">
                                <div className={"w-10 h-10 rounded-full flex items-center justify-center"} style={{ backgroundColor: props.color + "20" }}>
                                    {Leaf && <Leaf style={{ color: props.color }} />}
                                </div>
                                <div>
                                    <h3 className="font-bold text-gray-800">{props.type}</h3>
                                    <p className="text-xs text-gray-500">解鎖等級：Lv.{props.level}</p>
                                </div>
                            </div>
                            <p className="text-sm text-gray-600 mb-2">{props.description}</p>
                            <div className="flex items-center gap-1 text-xs font-semibold text-gray-500 bg-gray-100 w-fit px-2 py-1 rounded-full">
                                {MapPin && <MapPin size={12} />} {props.steps} 步
                            </div>
                        </div>
                    );
                };

                return (
                    <div className="pb-20">
                        <header className="bg-[#5FB85E] text-white p-6 rounded-b-[40px] shadow-lg sticky top-0 z-50">
                            <div className="max-w-4xl mx-auto flex items-center justify-between">
                                <div>
                                    <h1 className="text-2xl font-black flex items-center gap-2">{Leaf && <Leaf fill="white" />} Pikmin Wiki</h1>
                                    <p className="text-xs opacity-90 font-medium">讓每一天的散步都充滿驚喜 ✨</p>
                                </div>
                                <button onClick={handleInviteAction} className="bg-white/20 hover:bg-white/30 p-2 px-3 rounded-xl text-center relative transition-transform active:scale-95">
                                    <p className="text-[10px] uppercase font-bold">點擊複製 & 下載</p>
                                    <p className="font-mono font-bold tracking-widest flex items-center gap-1">{INVITE_CODE} {ExternalLink && <ExternalLink size={12} />}</p>
                                    {copyFeedback && <span className="absolute -bottom-8 left-0 right-0 text-[10px] bg-white text-[#5FB85E] py-1 rounded-full shadow-md animate-bounce border border-green-200">代碼已複製！</span>}
                                </button>
                            </div>
                        </header>

                        <main className="max-w-4xl mx-auto p-4 md:p-6">
                            <div className="flex overflow-x-auto gap-2 mb-4 no-scrollbar py-2">
                                {navItems.map(function(item) {
                                    return (
                                        <button key={item.id} onClick={function() { setActiveTab(item.id); }} className={"flex items-center gap-2 px-4 py-3 rounded-full whitespace-nowrap transition-all font-bold text-sm shadow-sm " + (activeTab === item.id ? 'bg-[#5FB85E] text-white' : 'bg-white text-[#5FB85E] border border-[#5FB85E]/20')}>
                                            {item.icon}{item.label}
                                        </button>
                                    );
                                })}
                            </div>

                            <AdBanner label="ADVERTISEMENT" />

                            <div className="space-y-6">
                                {activeTab === 'getting-started' && (
                                    <div className="space-y-6">
                                        <section className="bg-white rounded-3xl p-6 shadow-sm border border-green-100">
                                            <h2 className="text-xl font-bold text-[#3E7A3E] mb-4 flex items-center gap-2">{Star && <Star fill="#3E7A3E" size={20} />} 歡迎加入！</h2>
                                            <p className="text-gray-600 mb-4 leading-relaxed">這是一款結合「步行」與「收集」的治癒系遊戲。快出門讓世界開滿花朵吧！</p>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="bg-orange-50 p-4 rounded-2xl border border-orange-100">
                                                    <h4 className="font-bold text-orange-800 text-sm mb-2">🌱 核心目標</h4>
                                                    <ul className="text-sm text-orange-700 space-y-1">
                                                        <li>• 散步累積步數，培育花苗</li>
                                                        <li>• 餵食精華，收成花瓣來種花</li>
                                                        <li>• 提升友好度，收集可愛飾品</li>
                                                    </ul>
                                                </div>
                                                <button onClick={handleInviteAction} className="bg-blue-50 p-4 rounded-2xl border border-blue-100 text-left hover:bg-blue-100 transition-all relative">
                                                    <h4 className="font-bold text-blue-800 text-sm mb-2 flex items-center justify-between">🎁 點此複製並下載 {ExternalLink && <ExternalLink size={14} />}</h4>
                                                    <p className="text-xs text-blue-700">註冊輸入邀請碼，即可獲得 20 片花瓣及 10 顆精華！</p>
                                                    <div className="mt-2 text-blue-900 font-mono font-bold bg-white/70 rounded px-2 py-1 text-sm border border-blue-200 w-fit">{INVITE_CODE}</div>
                                                </button>
                                            </div>
                                        </section>
                                        <NativeAdCard />
                                    </div>
                                )}

                                {activeTab === 'pikmin-types' && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                        <PikminCard type="紅色皮克敏" steps="1,000" level="1" color="#EF4444" description="不怕火，攻擊力很高。" />
                                        <PikminCard type="黃色皮克敏" steps="1,000" level="2" color="#FACC15" description="不怕電，可以被拋得很高。" />
                                        <PikminCard type="藍色皮克敏" steps="1,000" level="4" color="#3B82F6" description="可以在水中呼吸，游泳健將。" />
                                        <PikminCard type="紫色皮克敏" steps="3,000" level="7" color="#A855F7" description="力氣很大，搬運能力極強。" />
                                        <PikminCard type="白色皮克敏" steps="3,000" level="9" color="#94A3B8" description="身體有毒，跑步速度極快。" />
                                        <PikminCard type="羽翅皮克敏" steps="5,000" level="10" color="#F472B6" description="會飛的小傢伙，適合空運。" />
                                    </div>
                                )}

                                <div className="text-center py-10 opacity-50 text-xs font-bold text-gray-400 tracking-widest">PIKMIN BLOOM WIKI © 2026</div>
                            </div>

                            <div className="bg-[#5FB85E] text-white p-6 rounded-3xl shadow-lg relative overflow-hidden mt-10">
                                <div className="relative z-10 text-center">
                                    <h3 className="font-bold text-lg mb-2">準備好出發了嗎？</h3>
                                    <p className="text-sm opacity-90 mb-4">點擊下方複製<b>邀請碼</b>並下載遊戲！</p>
                                    <button onClick={handleInviteAction} className="w-full bg-white text-[#5FB85E] font-black text-2xl p-4 rounded-2xl text-center tracking-widest shadow-xl hover:bg-green-50 active:scale-95 transition-all flex items-center justify-center gap-3">
                                        {INVITE_CODE} {ExternalLink && <ExternalLink size={20} />}
                                    </button>
                                </div>
                            </div>
                        </main>

                        <footer className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-2 py-2 flex justify-around md:hidden shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-40">
                            {navItems.slice(0, 4).map(function(item) {
                                return (
                                    <button key={item.id} onClick={function() { setActiveTab(item.id); }} className={"flex flex-col items-center p-2 rounded-xl " + (activeTab === item.id ? 'text-[#5FB85E]' : 'text-gray-400')}>
                                        {item.icon}<span className="text-[10px] font-bold mt-1">{item.label}</span>
                                    </button>
                                );
                            })}
                        </footer>
                    </div>
                );
            };

            var root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(App));
        })();
    </script>
</body>
</html>
